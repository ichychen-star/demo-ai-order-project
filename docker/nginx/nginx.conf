events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;
    client_max_body_size 15m;

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name vickychenaidemo.westus2.cloudapp.azure.com;
        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name vickychenaidemo.westus2.cloudapp.azure.com;

        ssl_certificate     /etc/letsencrypt/live/vickychenaidemo.westus2.cloudapp.azure.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vickychenaidemo.westus2.cloudapp.azure.com/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location /api/ {
            set $backend http://backend:8080;
            proxy_pass $backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
