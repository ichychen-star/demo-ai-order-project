services:

  nginx:
    image: nginx:alpine
    container_name: aivehicleorder-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/frontend:latest
    container_name: aivehicleorder-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://${DOMAIN}
    networks:
      - app-network
    restart: unless-stopped

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:latest
    container_name: aivehicleorder-backend
    env_file:
      - backend.env
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
